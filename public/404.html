<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nitesh Bhargava</title>
    <!--
      GitHub Pages serves this for any unknown path. The app is a single-page
      app, so /blog/<slug> has no file behind it and would otherwise 404 on a
      refresh or a shared link. Stash the path in a query param and hand back
      to index.html, which restores it before React Router boots.
    -->
    <script>
      var path = window.location.pathname + window.location.search;
      window.location.replace('/?p=' + encodeURIComponent(path) + window.location.hash);
    </script>
  </head>
  <body></body>
</html>
